apiVersion: v1
kind: ConfigMap
metadata:
  name: web-ui-config
  namespace: kitchen-app
data:
  nginx.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_pass http://api:3000/;
        }

        location /health {
            return 200 'OK';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Smart Kitchen Dashboard</title>
      <meta name="viewport" content="width=device-width, initial-scale=1">

      <style>
        body {
          margin:0;
          font-family: Arial;
          background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
          color:white;
        }

        .container {
          max-width:1000px;
          margin:auto;
          padding:20px;
        }

        h1 {
          text-align:center;
          font-size:40px;
          margin-bottom:10px;
        }

        .card {
          background: rgba(255,255,255,0.1);
          padding:20px;
          border-radius:15px;
          margin-top:20px;
          backdrop-filter: blur(10px);
        }

        input {
          padding:10px;
          width:70%;
          border:none;
          border-radius:10px;
        }

        button {
          padding:10px 15px;
          border:none;
          border-radius:10px;
          background:#00c6ff;
          color:white;
          cursor:pointer;
        }

        button:hover {
          background:#0072ff;
        }

        table {
          width:100%;
          margin-top:20px;
          border-collapse: collapse;
        }

        th,td {
          padding:10px;
          border-bottom:1px solid rgba(255,255,255,0.2);
        }

        .status {
          padding:5px 10px;
          border-radius:10px;
        }

        .pending { background:orange; }
        .preparing { background:blue; }
        .ready { background:green; }
        .served { background:gray; }

      </style>
    </head>

    <body>

      <div class="container">

        <h1>Smart Kitchen Dashboard</h1>

        <div class="card">
          <input id="dish" placeholder="Enter dish name"/>
          <button onclick="createOrder()">Add Order</button>
          <p id="msg"></p>
        </div>

        <div class="card">
          <h2>Orders</h2>
          <table>
            <thead>
              <tr>
                <th>Dish</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="orders"></tbody>
          </table>
        </div>

      </div>

      <script>
        const API="/api"

        async function loadOrders(){
          let res=await fetch(API+"/orders")
          let data=await res.json()

          let html=""
          data.forEach(o=>{
            html+=`
              <tr>
                <td>${o.dish}</td>
                <td><span class="status ${o.status}">${o.status}</span></td>
              </tr>
            `
          })

          document.getElementById("orders").innerHTML=html
        }

        async function createOrder(){
          let dish=document.getElementById("dish").value

          let res=await fetch(API+"/orders",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({dish})
          })

          let data=await res.json()
          document.getElementById("msg").innerText="Created: "+data.dish

          loadOrders()
        }

        loadOrders()
        setInterval(loadOrders,3000)
      </script>

    </body>
    </html>